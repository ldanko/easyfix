[workspace]

resolver = "2"

members = [
    "easyfix",
    "easyfix-core",
    "easyfix-dictionary",
    "easyfix-macros",
    "easyfix-messages",
    "easyfix-session",
    "easyfix-test-messages",
    "examples/acceptor",
]

default-members = [
    "easyfix",
    "easyfix-core",
    "easyfix-dictionary",
    "easyfix-macros",
    "easyfix-messages",
    "easyfix-session",
]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.6"
chrono = "0.4.38"
clap = "4.6"
convert_case = "0.6"
easyfix-core = { version = "0.1.0", path = "easyfix-core" }
easyfix-dictionary = { version = "0.4.2", path = "easyfix-dictionary" }
easyfix-macros = { version = "0.1.3", path = "easyfix-macros" }
easyfix-messages = { version = "0.6.4", path = "easyfix-messages" }
easyfix-session = { version = "0.11.5", path = "easyfix-session" }
easyfix-test-messages = { version = "0.1.0", path = "easyfix-test-messages" }
futures-util = "0.3.26"
itoa = "1.0"
memchr = "2.8.0"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
rust_decimal = { version = "1.36", default-features = false }
serde = "1.0"
serde_json = "1.0"
syn = "2.0"
thiserror = "2.0"
tokio = "1.38"
tokio-util = "0.7"
tracing = "0.1.40"

[workspace.lints.clippy]
# Inherited only by crates that opt in with `[lints] workspace = true` in their
# own manifest - a new crate without that block silently ignores all of this.
# Test-code exceptions live in `clippy.toml`. The float lints are absolute
# here: FIX values are decimal, so `f32`/`f64` have no place in them at all.
# The lints left out are listed at the end of this file.

absolute_paths = "deny"
allow_attributes_without_reason = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
large_futures = "warn"
let_underscore_future = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
panic_in_result_fn = "warn"
rc_mutex = "warn"
string_slice = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"

# Measured and deliberately left out: `unwrap_used`, `expect_used`, `panic`,
# `unreachable`, `unwrap_in_result`, `assertions_on_result_states`,
# `arithmetic_side_effects`, `let_underscore_must_use`, `map_err_ignore`,
# `allow_attributes`. Each failed one of two tests: a lint whose only available
# fix is an annotation on code that is already correct, or one that cannot stay
# clean in a test, an example or a build script without an attribute - a
# panicking construct is the expected form there. `indexing_slicing` was
# audited instead of enabled: all 37 library sites proved in bounds.
