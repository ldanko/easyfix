[package]
name = "easyfix-core"
version = "0.20.0"
authors = ["Łukasz Dańko <lukasz.danko@gmail.com>"]
license = "MIT"
description = "Easy FIX (Financial Information Exchange) toolset - core types."
repository = "https://github.com/ldanko/easyfix"
edition = "2024"

[lints]
workspace = true

[features]
# `rust_decimal/serde` covers both directions in one feature - it cannot be
# split into ser and de - so both features enable it. The plain `serde` variant
# is deliberate: it writes `Decimal` as a string, preserving the scale of the
# received value, where `serde-float` would round-trip through f64.
serde-serialize = ["dep:serde", "chrono/serde", "rust_decimal/serde"]
serde-deserialize = ["dep:serde", "chrono/serde", "rust_decimal/serde"]

[dependencies]
chrono = { workspace = true }
easyfix-macros = { workspace = true }
itoa = { workspace = true }
memchr = { workspace = true }
rust_decimal = { workspace = true, default-features = false }
serde = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
