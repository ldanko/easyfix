[package]
name = "easyfix-session"
version = "0.20.0"
authors = ["Łukasz Dańko <lukasz.danko@gmail.com>"]
license = "MIT"
description = "Easy FIX (Financial Information Exchange) toolset - session."
repository = "https://github.com/ldanko/easyfix"
readme = "README.md"
edition = "2024"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
easyfix-core = { workspace = true }
futures-util = { workspace = true }
memchr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }

[dev-dependencies]
easyfix-test-messages = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time", "macros", "rt", "test-util"] }
